# ─────────────────────────────────────────────────────────────
#  go_infra_link — Standalone Production Docker Compose Stack
#
#  Usage (one command):
#    ./scripts/prod.ps1
#
#  Or manually:
#    docker compose -f docker-compose.prod.yml up -d --build
#    docker compose -f docker-compose.prod.yml logs -f
#    docker compose -f docker-compose.prod.yml down
#
#  Prerequisites:
#    - .env file exists with APP_ENV=production and all required vars
#    - See .env.prod.example for a template
#
#  Differences from dev docker-compose.yml:
#    - Pre-compiled binaries (runtime/bootstrap build targets, no go run)
#    - No source volume mounts (immutable image)
#    - Backend HEALTHCHECK active
#    - Frontend served by Caddy on port 80 (static SPA + same-origin /api proxy)
#    - Postgres NOT exposed on host (internal network only)
#    - Backend NOT exposed on host (internal network only)
#    - Resource limits on all services via Compose keys
#    - pgAdmin excluded (dev tool)
# ─────────────────────────────────────────────────────────────

services:
  backend-bootstrap:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: bootstrap
    env_file:
      - .env
    environment:
      - DATABASE_URL=host=${POSTGRES_SERVICE_HOST:-postgres} user=${POSTGRES_USER:?POSTGRES_USER is required} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=${POSTGRES_DB:?POSTGRES_DB is required} port=${POSTGRES_CONTAINER_PORT:-5432} sslmode=${POSTGRES_SSLMODE:?POSTGRES_SSLMODE is required}
      - DB_ALLOW_UNSAFE_SSLMODE=${DB_ALLOW_UNSAFE_SSLMODE:-false}
      - SEED_USER_ENABLED=${SEED_USER_ENABLED:-true}
      - SEED_DUMMY_NOTIFICATIONS=${SEED_DUMMY_NOTIFICATIONS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    expose:
      - "${BACKEND_PORT:-8080}"
    env_file:
      - .env
    environment:
      - HTTP_ADDR=:${BACKEND_PORT:-8080}
      - DATABASE_URL=host=${POSTGRES_SERVICE_HOST:-postgres} user=${POSTGRES_USER:?POSTGRES_USER is required} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=${POSTGRES_DB:?POSTGRES_DB is required} port=${POSTGRES_CONTAINER_PORT:-5432} sslmode=${POSTGRES_SSLMODE:?POSTGRES_SSLMODE is required}
      - DB_ALLOW_UNSAFE_SSLMODE=${DB_ALLOW_UNSAFE_SSLMODE:-false}
      - REALTIME_BUS=${REALTIME_BUS:-postgres}
      - REALTIME_POSTGRES_CHANNEL=${REALTIME_POSTGRES_CHANNEL:-go_infra_link_realtime}
      - REALTIME_SUBSCRIBER_BUFFER=${REALTIME_SUBSCRIBER_BUFFER:-64}
      - REALTIME_EVENT_TTL=${REALTIME_EVENT_TTL:-10m}
      - SEED_USER_ENABLED=false
      - SEED_DUMMY_NOTIFICATIONS=false
    depends_on:
      backend-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${BACKEND_PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - BACKEND_UPSTREAM=backend:${BACKEND_PORT:-8080}
    depends_on:
      backend:
        condition: service_healthy
    cpus: "0.5"
    mem_limit: 64m
    restart: unless-stopped

  postgres:
    image: postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres18_data:/var/lib/postgresql
    command: ["postgres", "-p", "${POSTGRES_CONTAINER_PORT:-5432}"]
    # No ports: mapping — Postgres is only accessible within the Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -p ${POSTGRES_CONTAINER_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped

volumes:
  postgres18_data:
