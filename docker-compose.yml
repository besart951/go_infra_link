services:
  backend-bootstrap:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=host=${POSTGRES_SERVICE_HOST:-postgres} user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-go_infra_link} port=${POSTGRES_CONTAINER_PORT:-5432} sslmode=disable
    volumes:
      - ./backend:/src
    depends_on:
      postgres:
        condition: service_healthy
    command: ["go", "run", "./cmd/db-bootstrap"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    env_file:
      - .env
    environment:
      - HTTP_ADDR=:${BACKEND_PORT:-8080}
      - DATABASE_URL=host=${POSTGRES_SERVICE_HOST:-postgres} user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-go_infra_link} port=${POSTGRES_CONTAINER_PORT:-5432} sslmode=disable
    volumes:
      - ./backend:/src
    depends_on:
      backend-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${BACKEND_PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_INTERNAL_PORT:-5173}"
    env_file:
      - .env
    environment:
      - NODE_ENV=${APP_ENV:-development}
      - BACKEND_URL=http://backend:${BACKEND_PORT:-8080}
      - BACKEND_PORT=${BACKEND_PORT:-8080}
      - FRONTEND_INTERNAL_PORT=${FRONTEND_INTERNAL_PORT:-5173}
      - CI=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  postgres:
    image: postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-go_infra_link}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres18_data:/var/lib/postgresql
    command: ["postgres", "-p", "${POSTGRES_CONTAINER_PORT:-5432}"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:${POSTGRES_CONTAINER_PORT:-5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -p ${POSTGRES_CONTAINER_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest@sha256:ff557f69d9808085dc3554f56c1b06a36ac8cddabe4485212920b9604261abdb
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/pgpass <<EOF
        postgres:${POSTGRES_CONTAINER_PORT:-5432}:${POSTGRES_DB:-go_infra_link}:${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}
        EOF
        chmod 600 /tmp/pgpass

        cat > /tmp/servers.json <<EOF
        {
          "Servers": {
            "1": {
              "Name": "${PGADMIN_SERVER_NAME:-go_infra_link}",
              "Group": "Servers",
              "Host": "postgres",
              "Port": ${POSTGRES_CONTAINER_PORT:-5432},
              "MaintenanceDB": "${POSTGRES_DB:-go_infra_link}",
              "Username": "${POSTGRES_USER:-postgres}",
              "PassFile": "/tmp/pgpass",
              "SSLMode": "prefer"
            }
          }
        }
        EOF

        exec /entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres18_data:
  frontend_node_modules:
  pgadmin_data:
