services:
  postgres:
    image: postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: go_infra_link_e2e
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_e2e_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d go_infra_link_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend-bootstrap:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment: &backend-environment
      APP_ENV: e2e
      HTTP_ADDR: :8080
      APP_PUBLIC_URL: http://127.0.0.1
      JWT_SECRET: e2e-only-jwt-secret-not-for-production-please-change
      DB_TYPE: postgres
      DATABASE_URL: host=postgres user=e2e password=e2e dbname=go_infra_link_e2e port=5432 sslmode=disable
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: go_infra_link_e2e
      POSTGRES_SSLMODE: disable
      REALTIME_BUS: memory
      SEED_USER_ENABLED: "false"
      SEED_DUMMY_NOTIFICATIONS: "false"
      E2E_PLANNER_EMAIL: planner@example.test
      E2E_PLANNER_PASSWORD: planner-password
    depends_on:
      postgres:
        condition: service_healthy
    command: ["go", "run", "./cmd/db-bootstrap"]
    restart: "no"

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment: *backend-environment
    depends_on:
      backend-bootstrap:
        condition: service_completed_successfully
    command: ["go", "run", "./cmd/seeder"]
    restart: "no"

  e2e-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment: *backend-environment
    depends_on:
      seed:
        condition: service_completed_successfully
    command: ["go", "run", "./cmd/e2e-seed"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    environment: *backend-environment
    depends_on:
      e2e-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    environment:
      BACKEND_UPSTREAM: backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1::80"

volumes:
  postgres_e2e_data:
